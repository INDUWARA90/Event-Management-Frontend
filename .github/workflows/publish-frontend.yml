name: Publish frontend image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish frontend image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy frontend to EC2
    runs-on: ubuntu-latest
    needs: publish

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Connect to EC2 and deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            set -eu

            IMAGE="ghcr.io/induwara90/event-management-frontend:latest"

            echo "Pulling latest frontend image..."
            sudo docker pull "$IMAGE"

            echo "Replacing frontend container..."
            sudo docker rm -f event-frontend || true

            sudo docker run -d \
              --name event-frontend \
              --restart unless-stopped \
              -p 8080:8080 \
              "$IMAGE"

            echo "Checking frontend response..."
            sleep 3

            if ! curl -fsS http://localhost:8080/ >/dev/null; then
              echo "Frontend health check failed."
              sudo docker logs event-frontend
              exit 1
            fi

            sudo docker ps --filter "name=event-frontend"
            echo "Frontend deployment successful."
