name: Build, Publish, and Deploy Frontend

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes an older deployment.  Do not allow both to update the
# same VM at the same time.
concurrency:
  group: frontend-production-deployment
  cancel-in-progress: true

jobs:
  publish:
    name: Build and publish frontend image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/induwara90/event-management-frontend
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_BASE_URL=/api
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VM
    runs-on: ubuntu-latest
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          port: 22
          envs: GHCR_USER,GHCR_TOKEN
          script_stop: true
          script: |
            set -euo pipefail
            cd "$HOME/opt/event-manage"

            if ! docker compose config --services | grep -qx 'react-frontend'; then
              echo "The react-frontend service is missing from $HOME/opt/event-manage/docker-compose.yml"
              exit 1
            fi

            echo "Pulling updated frontend image..."
            # This short-lived workflow token lets the VM pull a private GHCR
            # package.  It is removed from the VM as soon as the image is pulled.
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose pull react-frontend
            docker logout ghcr.io >/dev/null 2>&1 || true

            echo "Updating frontend container..."
            docker compose up -d --no-deps react-frontend

            echo "Waiting for frontend service to become healthy..."
            for i in $(seq 1 30); do
              if curl -fsS "http://127.0.0.1:8080/healthz" >/dev/null 2>&1; then
                echo "Frontend is healthy and running!"
                docker compose ps
                echo "Pruning unused images..."
                docker image prune -f >/dev/null 2>&1 || true
                exit 0
              fi
              sleep 3
            done
            echo "Health check timed out after 90s!"
            docker compose ps
            docker compose logs react-frontend --tail=60
            exit 1
